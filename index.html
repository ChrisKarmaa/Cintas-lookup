<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cintas Location Lookup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --red: #c8102e;
  --dark: #0d1018;
  --panel: #161922;
  --panel2: #1c2130;
  --border: #262c3d;
  --text: #dde1ed;
  --muted: #6b7490;
  --accent: #ff3d5a;
  --green: #00d68f;
  --yellow: #ffc940;
  --blue: #4d9eff;
  --orange: #ff7a3d;
  --purple: #a78bfa;
  --teal: #2dd4bf;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  background: var(--panel);
  border-bottom: 2px solid var(--red);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--red);
  text-transform: uppercase;
  white-space: nowrap;
}

.header-stats {
  display: flex;
  gap: 12px;
  margin-left: auto;
  flex-wrap: wrap;
}

.stat-pill {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* ── TOOLBAR ── */
.toolbar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}

.search-wrap input {
  width: 100%;
  background: var(--dark);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  padding: 8px 10px 8px 32px;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.15s;
}

.search-wrap input:focus { border-color: var(--red); }
.search-wrap input::placeholder { color: var(--muted); }

.search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}

.filter-sel {
  background: var(--dark);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 4px;
  outline: none;
  cursor: pointer;
}

.type-filters {
  display: flex;
  gap: 4px;
}

.type-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 12px;
  border: 1px solid transparent;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.12s;
  background: var(--panel2);
  color: var(--muted);
}

.type-btn.active { color: var(--dark) !important; border-color: transparent; }
.type-btn:hover { opacity: 0.85; }

.result-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  padding: 0 4px;
}

.result-count strong { color: var(--yellow); }

/* ── MAIN LAYOUT ── */
.main {
  display: grid;
  grid-template-columns: 320px 1fr;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── LIST ── */
.list-panel {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--panel);
  min-height: 0;
}

.list-panel::-webkit-scrollbar { width: 4px; }
.list-panel::-webkit-scrollbar-track { background: transparent; }
.list-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.loc-item {
  padding: 11px 14px;
  border-bottom: 1px solid rgba(38,44,61,0.7);
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: background 0.1s;
}

.loc-item:hover { background: rgba(200,16,46,0.07); }
.loc-item.active { background: rgba(200,16,46,0.14); border-left: 3px solid var(--red); padding-left: 11px; }

.loc-num-col {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--red);
  min-width: 52px;
  padding-top: 1px;
}

.loc-info-col { flex: 1; overflow: hidden; }

.loc-name-txt {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  line-height: 1.3;
}

.loc-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.loc-badges {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-top: 3px;
  flex-wrap: wrap;
}

.mini-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.3px;
}

.email-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}

.no-results {
  padding: 40px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* ── DETAIL ── */
.detail-panel {
  overflow-y: auto;
  background: var(--dark);
  min-height: 0;
}

.detail-panel::-webkit-scrollbar { width: 5px; }
.detail-panel::-webkit-scrollbar-track { background: transparent; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  gap: 8px;
}

.empty-state .big { font-size: 48px; }
.empty-state p { font-size: 13px; }

.detail-inner { padding: 24px; max-width: 720px; }

.detail-header {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}

.detail-locnum {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 28px;
  font-weight: 600;
  color: var(--red);
  line-height: 1;
}

.detail-meta { flex: 1; }

.detail-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}

.detail-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

/* ── SECTIONS ── */
.section { margin-bottom: 18px; }

.section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.info-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
}

.hours-card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}

.hours-item label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 2px;
}

.hours-item span {
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
}

.hours-highlight {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--yellow);
  font-weight: 600;
}

.email-list { display: flex; flex-direction: column; gap: 5px; }

.email-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px 12px;
}

.email-role {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  min-width: 90px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.email-addr {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text);
  flex: 1;
  word-break: break-all;
}

.notes-card {
  background: rgba(255,201,64,0.07);
  border: 1px solid rgba(255,201,64,0.2);
  border-left: 3px solid var(--yellow);
  border-radius: 6px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
}

.copy-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 7px 14px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  transition: all 0.12s;
  text-transform: uppercase;
}

.btn-primary { background: var(--red); color: white; }
.btn-primary:hover { background: var(--accent); }
.btn-sec { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.btn-sec:hover { border-color: var(--red); color: var(--red); }
.btn.done { background: var(--green) !important; color: var(--dark) !important; }

.no-email { color: var(--muted); font-style: italic; font-size: 12px; padding: 8px 0; }

mark { background: rgba(200,16,46,0.25); color: var(--text); border-radius: 2px; }
</style>
</head>

// ── Business type config ──
const TYPE_CFG = {
  FS:     { label:'FS',     color:'#4d9eff', bg:'rgba(77,158,255,0.15)'  },
  Rental: { label:'Rental', color:'#00d68f', bg:'rgba(0,214,143,0.12)'  },
  FAS:    { label:'FAS',    color:'#ffc940', bg:'rgba(255,201,64,0.15)' },
  Fire:   { label:'Fire',   color:'#ff7a3d', bg:'rgba(255,122,61,0.15)' },
  DC:     { label:'DC',     color:'#a78bfa', bg:'rgba(167,139,250,0.15)' },
};

// Header stats
const typeCounts = {};
DATA.forEach(d => { typeCounts[d.biz_type] = (typeCounts[d.biz_type]||0)+1; });
const hs = document.getElementById('headerStats');
Object.entries(typeCounts).forEach(([t,n]) => {
  const cfg = TYPE_CFG[t] || {color:'#888',bg:'rgba(136,136,136,0.15)'};
  const el = document.createElement('div');
  el.className = 'stat-pill';
  el.style.cssText = `color:${cfg.color};background:${cfg.bg};border:1px solid ${cfg.color}33`;
  el.textContent = `${cfg.label} ${n}`;
  hs.appendChild(el);
});

// Type filter buttons
let activeType = '';
const tf = document.getElementById('typeFilters');
[['', 'All'], ...Object.entries(TYPE_CFG).map(([k,v]) => [k, v.label])].forEach(([t, lbl]) => {
  const btn = document.createElement('button');
  btn.className = 'type-btn' + (t === '' ? ' active' : '');
  btn.textContent = lbl;
  if (t) {
    const cfg = TYPE_CFG[t];
    btn.style.cssText = `color:${cfg.color};border-color:${cfg.color}44`;
    btn.dataset.color = cfg.color;
    btn.dataset.bg = cfg.bg;
  } else {
    btn.style.cssText = 'color:#ccc;border-color:#ccc44';
    btn.dataset.color = '#ccc';
    btn.dataset.bg = 'rgba(200,200,200,0.1)';
  }
  btn.addEventListener('click', () => {
    activeType = t;
    document.querySelectorAll('.type-btn').forEach(b => {
      b.classList.remove('active');
      b.style.background = 'var(--panel2)';
    });
    btn.classList.add('active');
    btn.style.background = btn.dataset.bg;
    btn.style.color = btn.dataset.color;
    doSearch();
  });
  tf.appendChild(btn);
});

let filtered = [...DATA];
let selected = null;

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hl(text, q) {
  if (!q) return esc(text);
  const escaped = esc(text);
  const qe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return escaped.replace(new RegExp(qe,'gi'), m => `<mark>${m}</mark>`);
}

function typeStyle(bt) {
  const cfg = TYPE_CFG[bt] || {color:'#888',bg:'rgba(136,136,136,0.12)'};
  return `color:${cfg.color};background:${cfg.bg}`;
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const region = document.getElementById('regionFilter').value;
  filtered = DATA.filter(loc => {
    if (activeType && loc.biz_type !== activeType) return false;
    if (region && loc.region !== region) return false;
    if (!q) return true;
    const hay = [loc.loc_num, loc.name, loc.city, loc.state, loc.addr1, loc.region,
                 ...(loc.emails||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  renderList(q);
}

function renderList(q) {
  const panel = document.getElementById('listPanel');
  document.getElementById('resultCount').innerHTML = `<strong>${filtered.length}</strong> results`;

  if (!filtered.length) {
    panel.innerHTML = '<div class="no-results">No locations found</div>';
    return;
  }

  panel.innerHTML = filtered.map(loc => {
    const hasEmails = (loc.emails||[]).filter(e=>e&&e.includes('@')).length > 0;
    const hasHours = !!(loc.receiving_hours||'').trim();
    const city = loc.city ? `${loc.city}, ${loc.state}` : (loc.region || '—');
    const cfg = TYPE_CFG[loc.biz_type] || {color:'#888'};
    const isActive = selected === loc.loc_num;
    return `<div class="loc-item${isActive?' active':''}" onclick="selectLoc('${loc.loc_num.replace(/'/g,"\\'")}')">
      <div class="loc-num-col">${hl(loc.loc_num, q)}</div>
      <div class="loc-info-col">
        <div class="loc-name-txt">${hl(loc.name, q)}</div>
        <div class="loc-sub">${hl(city, q)}</div>
        <div class="loc-badges">
          <span class="mini-badge" style="${typeStyle(loc.biz_type)}">${loc.biz_type}</span>
          ${hasHours ? '<span class="mini-badge" style="color:#2dd4bf;background:rgba(45,212,191,0.12)">🕐 hrs</span>' : ''}
        </div>
      </div>
      <div class="email-dot" style="background:${hasEmails ? '#00d68f' : 'var(--border)'}"></div>
    </div>`;
  }).join('');
}

function selectLoc(locNum) {
  selected = locNum;
  const loc = DATA.find(d => d.loc_num === locNum);
  if (!loc) return;
  renderList(document.getElementById('searchInput').value.trim().toLowerCase());
  renderDetail(loc);
}

function renderDetail(loc) {
  const panel = document.getElementById('detailPanel');
  const cfg = TYPE_CFG[loc.biz_type] || {color:'#888',bg:'rgba(136,136,136,0.1)'};
  
  const validEmails = (loc.emails||[]).filter(e => e && e.includes('@')).map(e => e.trim());
  
  const addr = [loc.addr1, loc.addr2, loc.city&&`${loc.city}, ${loc.state} ${loc.zip}`].filter(Boolean).join('\n');

  // Hours section
  const hasHours = loc.receiving_hours || loc.delivery_day || loc.order_day;
  const hoursHTML = hasHours ? `
    <div class="section">
      <div class="section-label">Schedule & Hours</div>
      <div class="hours-card">
        ${loc.receiving_hours ? `<div class="hours-item"><label>Receiving Hours</label><span class="hours-highlight">${esc(loc.receiving_hours)}</span></div>` : ''}
        ${loc.delivery_day ? `<div class="hours-item"><label>Delivery Day</label><span>${esc(loc.delivery_day)}</span></div>` : ''}
        ${loc.order_day ? `<div class="hours-item"><label>Order Day</label><span>${esc(loc.order_day)}</span></div>` : ''}
        ${loc.ship_day ? `<div class="hours-item"><label>Ship Day</label><span>${esc(loc.ship_day)}</span></div>` : ''}
      </div>
    </div>` : '';

  // Roles section
  const roles = [
    ['Plant Mgr', loc.plant_mgr],
    ['Stockroom Sup', loc.stockroom_sup],
    ['General Mgr', loc.general_mgr],
    ['Secondary', loc.secondary_email],
  ].filter(([,v]) => v && v.trim() && !['na','n/a'].includes(v.trim().toLowerCase()));

  const rolesHTML = roles.length ? `
    <div class="section">
      <div class="section-label">Contacts by Role</div>
      <div class="email-list">
        ${roles.map(([role,val]) => `
          <div class="email-row">
            <div class="email-role">${role}</div>
            <div class="email-addr">${esc(val.trim())}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  panel.innerHTML = `
    <div class="detail-inner">
      <div class="detail-header">
        <div class="detail-locnum">#${esc(loc.loc_num)}</div>
        <div class="detail-meta">
          <div class="detail-name">${esc(loc.name)}</div>
          <div class="detail-badges">
            <span class="badge" style="${typeStyle(loc.biz_type)}">${loc.biz_type}</span>
            ${loc.loc_type ? `<span class="badge" style="color:var(--muted);background:var(--panel2)">${esc(loc.loc_type)}</span>` : ''}
            ${loc.region ? `<span class="badge" style="color:var(--muted);background:var(--panel2)">${esc(loc.region)}</span>` : ''}
          </div>
        </div>
      </div>

      ${addr ? `<div class="section">
        <div class="section-label">Address</div>
        <div class="info-card" style="font-size:13px;line-height:1.7;white-space:pre-line">${esc(addr)}</div>
      </div>` : ''}

      ${hoursHTML}

      <div class="section">
        <div class="section-label">Email Contacts (${validEmails.length})</div>
        ${validEmails.length ? `<div class="email-list">
          ${validEmails.map(e => `<div class="email-row"><div class="email-addr">${esc(e)}</div></div>`).join('')}
        </div>
        <div class="copy-row">
          <button class="btn btn-primary" id="btnSemi" onclick="copyEmails('${loc.loc_num.replace(/'/g,"\\'")}',' semi')">⎘ Copy — Separated</button>
          <button class="btn btn-sec" id="btnComma" onclick="copyEmails('${loc.loc_num.replace(/'/g,"\\'")}',' comma')">⎘ Copy Comma</button>
        </div>` : `<div class="no-email">No email contacts on file</div>`}
      </div>

      ${rolesHTML}

      ${loc.notes ? `<div class="section">
        <div class="section-label">⚠ Delivery Notes</div>
        <div class="notes-card">${esc((loc.notes||'').trim())}</div>
      </div>` : ''}
    </div>`;
}

function copyEmails(locNum, fmt) {
  const loc = DATA.find(d => d.loc_num === locNum);
  if (!loc) return;
  const emails = (loc.emails||[]).filter(e => e && e.includes('@')).map(e => e.trim());
  if (!emails.length) return;
  const text = fmt === ' semi' ? emails.join('; ') : emails.join(', ');
  navigator.clipboard.writeText(text).then(() => {
    const id = fmt === ' semi' ? 'btnSemi' : 'btnComma';
    const btn = document.getElementById(id);
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 2000);
  });
}

document.getElementById('searchInput').addEventListener('input', doSearch);
document.getElementById('regionFilter').addEventListener('change', doSearch);

doSearch();
</script>
